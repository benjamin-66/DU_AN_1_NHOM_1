<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">

</head>

<body>
    <div class="container">
        <h1>Form Edit</h1>
        <form class="row" id="frm">
            <div class="col-xl-6 col-md-12 mt-3">
                <label for="first" class="lable-control">First</label>
                <input type="text" class="form-control" id="first" placeholder="Please enter first">
                <span style="display: none;" id="inval-first" class="text-danger">First name is required</span>
            </div>
            <div class="col-xl-6 col-md-12 mt-3">
                <label for="last" class="lable-control">Last</label>
                <input type="text" class="form-control" id="last" placeholder="Please enter last">
                <span style="display: none;" id="inval-last" class="text-danger">Last is required</span>

            </div>
            <div class="col-12 mt-3">
                <label for="handle" class="lable-control">Handle</label>
                <input type="text" class="form-control" id="handle" placeholder="Please enter handle">
                <span style="display: none;" id="inval-handle" class="text-danger">Handle is required</span>
            </div>
            <div class="col-12 mt-4">
                <button type="button" onclick="edit()" class="btn btn-success">Edit</button>
            </div>
        </form>
    </div>
    <script src="../js/axios.js"></script>
    <script src="../js/edit.js"></script>
</body>

</html>
