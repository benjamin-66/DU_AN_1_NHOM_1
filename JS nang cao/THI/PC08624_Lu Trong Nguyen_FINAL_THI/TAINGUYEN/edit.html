<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Form</title>
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">      
    <link rel="stylesheet" href="css/bootstrap.min.css">       
    <link rel="stylesheet" href="slick/slick.min.css">       
    <link rel="stylesheet" href="slick/slick-theme.css">
    <link rel="stylesheet" href="css/templatemo-upright.css">
</head>
<body>
    <div class="pl-5">
        <div id="contact" class="tm-section">
            <h2 class="tm-text-primary">Edit Form</h2>
            <div class="row">
                <div class="col-xl-12 tm-contact-col-l mb-4">
                    <!-- Form bắt đầu từ đây -->
                    <form id="contact-form" class="tm-contact-form">
                        <div class="form-group mb-3">
                            <input type="text" class="form-control rounded-0" id="title" name="title" placeholder="Title" required />
                        </div>
                        <div class="form-group mb-3">
                            <input type="text" class="form-control rounded-0" id="subtitle" name="subtitle" placeholder="Subtitle" required />
                        </div>
                        <div class="form-group mb-3">
                            <textarea rows="8" id="truncate" name="truncate" class="form-control rounded-0" placeholder="Truncate" required></textarea>
                        </div>
                        <div class="form-group tm-text-right">
                            <button type="button" onclick="edit()" class="btn btn-primary">Update</button>
                        </div>
                    </form>
                    <!-- Form kết thúc tại đây -->
                </div>
            </div>
        </div>
    </div>
    <!-- Các script cần thiết -->
    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/jquery.singlePageNav.min.js"></script>
    <script src="js/parallax/parallax.min.js"></script>
    <script src="js/imagesloaded.pkgd.min.js"></script>
    <script src="js/isotope.pkgd.min.js"></script> 
    <script src="js/jquery.magnific-popup.min.js"></script> 
    <script src="slick/slick.min.js"></script>             
    <script src="js/templatemo-script.js"></script>
    <script src="./js/axios.js"></script>
    <script src="./js/edit.js"></script>
</body>
</html>
