<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
</head>
<body>
    
    <div class="pl-5">
        <div id="contact" class="tm-section">
            <h2 class="tm-text-primary">Add Form</h2>
            <div class="row">
                <div class="col-xl-12 tm-contact-col-l mb-4">
                    <form id="contact-form" class="tm-contact-form" onsubmit="add(event)">
                        <div class="form-group mb-3">
                            <input type="text" class="form-control rounded-0" name="title" placeholder="Title" />
                        </div>
                        <div class="form-group mb-3">
                            <input type="text" class="form-control rounded-0" name="subtitle" placeholder="Subtitle" />
                        </div>
                        <div class="form-group mb-3">
                            <input type="text" class="form-control rounded-0" name="truncate" placeholder="Content" />
                        </div>
                        <div class="form-group tm-text-right">
                            <button type="submit" class="btn btn-primary">Send</button>
                        </div>
                    </form>
                </div>
                
            </div>
        </div>
    </div>

    <script src="./js/axios.js"></script>
    <script src="./js/add.js"></script>
</body>
</html>
